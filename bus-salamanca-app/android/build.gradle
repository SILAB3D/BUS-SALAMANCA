// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Windows can keep stale handles in plugin build folders; use per-build dirs.
subprojects { subproject ->
    if (subproject.name == "capacitor-local-notifications" || subproject.name == "capacitor-android") {
        def stamp = System.currentTimeMillis()
        subproject.buildDir = file("${rootProject.projectDir}/../.gradle-temp/${subproject.name}-${stamp}")
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
