apply plugin: 'com.android.application'

/*
 * Version derivada de git, no escrita a mano.
 *
 * Android solo acepta actualizar a un versionCode ESTRICTAMENTE mayor. Si hay
 * que acordarse de subirlo en cada push, el canal de actualizacion deja de
 * funcionar en silencio el dia que se olvide. Contarlo de los commits lo hace
 * crecer solo.
 *
 * VERSION_CODE_BASE existe porque las versiones anteriores a este sistema
 * llegaron a mano hasta el 430, muy por encima de los commits del repositorio:
 * sin la base, la primera release automatica saldria por debajo de lo ya
 * instalado y el movil no la reconoceria como actualizacion.
 *
 * Contrapartida: no se puede reescribir la historia de main. Un rebase o un
 * push --force que reduzca el numero de commits deja las releases nuevas por
 * debajo de lo instalado.
 */
ext.VERSION_CODE_BASE = 1000

static def gitCommitCount(providers) {
    try {
        def result = providers.exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
        }.standardOutput.asText.get().trim()
        return result.isInteger() ? result.toInteger() : 0
    } catch (Exception ignored) {
        // Sin git (por ejemplo, compilando desde un zip) se cae a 0: la version
        // sale como la base y el build no se rompe.
        return 0
    }
}

static def readPackageVersion(rootDir) {
    def file = new File(rootDir, '../package.json')
    if (!file.exists()) {
        return '0.0.0'
    }
    return new groovy.json.JsonSlurper().parse(file).version ?: '0.0.0'
}

/*
 * El NOMBRE de la version es el del ultimo commit que lo lleve por titulo
 * ("v5.1", "v5", "4.9"), que es como se marcan aqui las versiones. La misma
 * regla vive en tools/version.mjs: si las dos se separan, la app enseñaria un
 * nombre y la release se publicaria con otro.
 *
 * Se mira hacia atras y no solo la punta porque despues de marcar la v5.1
 * pueden venir commits normales, que no renombran nada. Solo se pide que sean
 * digitos y puntos: es lo que distingue "v5.1" de "arreglar el mapa".
 */
static def gitVersionName(providers) {
    try {
        def log = providers.exec {
            commandLine 'git', 'log', '-200', '--pretty=%s'
        }.standardOutput.asText.get()

        for (line in log.readLines()) {
            def matcher = (line.trim() =~ /^v?(\d+(?:\.\d+)*)$/)
            if (matcher.matches()) {
                return matcher.group(1)
            }
        }
    } catch (Exception ignored) {
        // Sin git (compilando desde un zip) se cae a package.json.
    }
    return null
}

def salbusVersionCode = ext.VERSION_CODE_BASE + gitCommitCount(providers)
def salbusVersionName = gitVersionName(providers) ?: readPackageVersion(rootProject.projectDir)

/*
 * Firma de release. La clave NO vive en el repositorio: en local se lee de
 * android/keystore.properties (ignorado por git) y en CI de variables de
 * entorno que salen de los secrets. Sin ninguna de las dos, la tarea de
 * release falla con un mensaje claro en vez de firmar con la clave de debug,
 * que produciria una APK que el movil rechaza como actualizacion.
 */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSigning = { String key, String env ->
    return System.getenv(env) ?: keystoreProperties.getProperty(key)
}

def releaseStoreFile = resolveSigning('storeFile', 'SALBUS_KEYSTORE_FILE')
def releaseStorePassword = resolveSigning('storePassword', 'SALBUS_KEYSTORE_PASSWORD')
def releaseKeyAlias = resolveSigning('keyAlias', 'SALBUS_KEY_ALIAS')
def releaseKeyPassword = resolveSigning('keyPassword', 'SALBUS_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile != null && file(releaseStoreFile).exists()

/*
 * NOMBRE DEL PAQUETE: dos cosas distintas que NO se pueden igualar.
 *
 *  - namespace es donde vive el codigo (com.icuas.salbus, como el proyecto y la
 *    app). Es interno: cambiarlo no lo nota nadie de fuera.
 *
 *  - applicationId es la IDENTIDAD de la app para Android, y tiene que seguir
 *    siendo com.icuas.bussalamanca para siempre. Con otro identificador el
 *    sistema ve una app diferente: la instalada no se actualizaria, quedarian
 *    dos iconos y las paradas, avisos e historial guardados —que viven en el
 *    almacenamiento de ESE identificador— se quedarian en la vieja.
 */
android {
    namespace = "com.icuas.salbus"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.icuas.bussalamanca"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode salbusVersionCode
        versionName salbusVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Firmar una release con la clave de debug produce una APK que ningun movil
// aceptara como actualizacion de la anterior. Mejor romper el build aqui.
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease' && !hasReleaseSigning) {
        task.doFirst {
            throw new GradleException(
                'Falta la clave de firma de release. Crea android/keystore.properties ' +
                '(storeFile, storePassword, keyAlias, keyPassword) o exporta ' +
                'SALBUS_KEYSTORE_FILE, SALBUS_KEYSTORE_PASSWORD, SALBUS_KEY_ALIAS y SALBUS_KEY_PASSWORD.'
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
