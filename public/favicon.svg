<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SALBUS">
  <!--
    Version WEB de la marca: fondo a sangre, SIN esquinas redondeadas propias.

    El recuadro redondeado que llevaba antes se veia como un segundo borde
    dentro de la forma que dibuja el lanzador de Android. Quien redondea es
    siempre quien enmarca: el lanzador con su mascara, o `.topbar-mark` con su
    `border-radius`. La marca sola, sin fondo, vive en `icon-mark.svg`.
  -->
  <defs>
    <linearGradient id="salbus-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d63ff"/>
      <stop offset="0.55" stop-color="#0d47c8"/>
      <stop offset="1" stop-color="#062a86"/>
    </linearGradient>
    <linearGradient id="salbus-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdfff"/>
      <stop offset="1" stop-color="#35b2ef"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" fill="url(#salbus-bg)"/>

  <g transform="translate(0.8 6.4) scale(0.8)">
    <!-- Ruedas -->
    <g fill="#062a86">
      <rect x="22" y="52" width="8" height="9" rx="3.5"/>
      <rect x="48" y="52" width="8" height="9" rx="3.5"/>
    </g>

    <!-- Carroceria -->
    <rect x="15" y="4" width="48" height="50" rx="11" fill="#ffffff"/>

    <!-- Parabrisas -->
    <rect x="21" y="11" width="36" height="16" rx="5" fill="url(#salbus-glass)"/>

    <!-- Faros -->
    <circle cx="25.5" cy="41" r="4" fill="#ffcf3d"/>
    <circle cx="52.5" cy="41" r="4" fill="#ffcf3d"/>

    <!-- Parrilla -->
    <rect x="32" y="38" width="14" height="5.5" rx="2.75" fill="#0d47c8"/>
  </g>
</svg>
