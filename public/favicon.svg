<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SALBUS">
  <defs>
    <linearGradient id="salbus-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d63ff"/>
      <stop offset="0.55" stop-color="#0d47c8"/>
      <stop offset="1" stop-color="#062a86"/>
    </linearGradient>
    <linearGradient id="salbus-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdfff"/>
      <stop offset="1" stop-color="#35b2ef"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#salbus-bg)"/>

  <!-- Estelas de movimiento -->
  <g fill="#ffffff" opacity="0.34">
    <rect x="3" y="23" width="8" height="3" rx="1.5"/>
    <rect x="1" y="30.5" width="10" height="3" rx="1.5"/>
    <rect x="4" y="38" width="7" height="3" rx="1.5"/>
  </g>

  <!-- Ruedas -->
  <g fill="#062a86">
    <rect x="21" y="47" width="7" height="8" rx="3"/>
    <rect x="42" y="47" width="7" height="8" rx="3"/>
  </g>

  <!-- Carroceria -->
  <rect x="16" y="10" width="38" height="40" rx="9" fill="#ffffff"/>

  <!-- Parabrisas -->
  <rect x="21" y="16" width="28" height="13" rx="4" fill="url(#salbus-glass)"/>

  <!-- Faros -->
  <circle cx="24.5" cy="40.5" r="3.2" fill="#ffcf3d"/>
  <circle cx="45.5" cy="40.5" r="3.2" fill="#ffcf3d"/>

  <!-- Parrilla -->
  <rect x="29.5" y="38.3" width="11" height="4.4" rx="2.2" fill="#0d47c8"/>
</svg>
